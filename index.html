<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>偉特塔羅 · 抽牌與筆記</title>
    <style>
      :root {
        --bg: #f4efe6;
        --fg: #2a2433;
        --card: #fffaf0;
        --acc: #7a4fb0;
        --mut: #80788a;
        --bd: #d8cfbf;
        --back: #5b3d8f;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #15121f;
          --fg: #ece6f5;
          --card: #221d33;
          --acc: #c3a2f2;
          --mut: #9a92aa;
          --bd: #3a3250;
          --back: #3c2a66;
        }
      }
      :root[data-theme="dark"] {
        --bg: #15121f;
        --fg: #ece6f5;
        --card: #221d33;
        --acc: #c3a2f2;
        --mut: #9a92aa;
        --bd: #3a3250;
        --back: #3c2a66;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.6 "Noto Serif TC",
          "PingFang TC",
          "Microsoft JhengHei",
          serif;
      }
      main {
        max-width: 980px;
        margin: auto;
        padding: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 4px 0 12px;
        color: var(--acc);
      }
      nav {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 6px 12px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--acc);
      }
      button.on,
      button.pri {
        background: var(--acc);
        color: var(--bg);
        border-color: var(--acc);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .row input[type="text"] {
        flex: 1;
        min-width: 180px;
      }
      .slots {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 16px 0;
      }
      .slot {
        text-align: center;
        font-size: 12px;
        color: var(--mut);
      }
      .card {
        width: 112px;
        height: 184px;
        border-radius: 10px;
        border: 2px solid var(--bd);
        background: var(--card);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        padding: 6px;
        transition: transform 0.2s;
        user-select: none;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: var(--acc);
      }
      .card.back {
        background:
          repeating-linear-gradient(
            45deg,
            var(--back) 0 8px,
            transparent 8px 16px
          ),
          var(--back);
        color: #fff;
        font-size: 30px;
      }
      .card .sym {
        font-size: 30px;
      }
      .card .n {
        font-size: 11px;
        color: var(--mut);
      }
      .card .z {
        font-weight: 700;
        font-size: 15px;
        text-align: center;
      }
      .card .e {
        font-size: 10px;
        color: var(--mut);
        text-align: center;
      }
      .card.rev .sym,
      .card.rev .z {
        transform: rotate(180deg);
      }
      .card .tag {
        font-size: 11px;
        color: var(--acc);
      }
      .detail {
        border: 1px solid var(--bd);
        background: var(--card);
        border-radius: 12px;
        padding: 14px;
        min-height: 120px;
      }
      .detail h3 {
        margin: 0 0 6px;
        color: var(--acc);
      }
      .detail p {
        margin: 4px 0;
      }
      .hl {
        border-left: 3px solid var(--acc);
        padding-left: 8px;
      }
      .dim {
        color: var(--mut);
      }
      #deck-det {
        margin-bottom: 20px;
      }
      #deck-bar {
        margin-bottom: 12px;
      }
      #deck-bar select {
        min-width: 140px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 14px;
      }
      .grid .card {
        width: 84px;
        height: 120px;
      }
      .grid .z {
        font-size: 12px;
      }
      .grid .e {
        display: none;
      }
      .grid .sym {
        font-size: 22px;
      }
      .entry {
        border: 1px solid var(--bd);
        background: var(--card);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .entry textarea {
        width: 100%;
        min-height: 70px;
        margin-top: 6px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .chip {
        border: 1px solid var(--bd);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--acc);
      }
      .mut {
        color: var(--mut);
        font-size: 13px;
      }
      .hide {
        display: none;
      }
      .card img {
        width: 100%;
        flex: 1;
        min-height: 0;
        object-fit: contain;
        border-radius: 4px;
      }
      .card.rev img {
        transform: rotate(180deg);
      }
      .card.im {
        justify-content: space-between;
        padding: 4px;
      }
      .card.im .n,
      .card.im .e {
        display: none;
      }
      .card.im.rev .z {
        transform: none;
      }
      .card.im .z {
        font-size: 12px;
      }
      .grid .card.im {
        height: 150px;
      }
      .grid .card.im .z {
        font-size: 10px;
      }
      .slots {
        display: block;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .flow {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .lay {
        position: relative;
        margin: 0 auto;
      }
      .lay .slot {
        position: absolute;
      }
      .lb {
        height: 20px;
        line-height: 20px;
        white-space: nowrap;
      }
      .slots.sm {
        --cw: 92px;
        --ch: 158px;
      }
      .hs {
        --cw: 78px;
        --ch: 134px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .slots .card,
      .hs .card {
        width: var(--cw, 112px);
        height: var(--ch, 184px);
      }
      .hs .slot {
        font-size: 11px;
      }
      .hs .card .z {
        font-size: 11px;
      }
      .hs .card .sym {
        font-size: 20px;
      }
      .hs .card .e,
      .hs .card .n {
        display: none;
      }
      .slot.rot {
        z-index: 2;
      }
      .slot.rot .card,
      .slot.rot .card:hover {
        transform: rotate(90deg) scale(0.82);
        margin-top: 20px;
      }
      .slot.rot .lb {
        position: absolute;
        top: calc(var(--ch, 184px) + 20px);
        left: 0;
        right: 0;
      }
      .card.back.empty {
        background: transparent;
        border-style: dashed;
        cursor: default;
      }
      .cg {
        display: grid;
        grid-template-columns: repeat(7, 46px);
        gap: 4px;
      }
      .cg button {
        height: 58px;
        padding: 0;
        font-size: 11px;
        line-height: 1.2;
      }
      details {
        margin: 6px 0;
      }
      .det {
        display: flex;
        gap: 14px;
      }
      .det img {
        height: 240px;
        border-radius: 6px;
        border: 1px solid var(--bd);
      }
      .det img.rev {
        transform: rotate(180deg);
      }
      .dbody {
        flex: 1;
        min-width: 0;
      }
      .detail textarea {
        width: 100%;
        min-height: 54px;
        margin: 2px 0 6px;
      }
      .pm {
        background: color-mix(in srgb, var(--acc) 12%, transparent);
        border-radius: 8px;
        padding: 6px 10px;
        margin-top: 8px;
      }
      @media (max-width: 560px) {
        .det {
          flex-direction: column;
          align-items: center;
        }
      }
      .tip {
        position: fixed;
        z-index: 1000;
        max-width: min(320px, calc(100vw - 24px));
        pointer-events: none;
        border: 1px solid var(--bd);
        background: var(--card);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 10px 28px color-mix(in srgb, var(--fg) 18%, transparent);
        font-size: 13px;
        line-height: 1.55;
      }
      .tip h3 {
        margin: 0 0 4px;
        font-size: 15px;
        color: var(--acc);
      }
      .tip p {
        margin: 4px 0;
      }
      .tip img {
        display: block;
        max-height: 140px;
        margin: 0 auto 8px;
        border-radius: 6px;
        border: 1px solid var(--bd);
      }
      .tip .pm {
        margin-top: 6px;
        font-size: 12px;
      }
      #auth-bar {
        margin-left: auto;
        align-items: center;
      }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  </head>
  <body>
    <main>
      <h1>🔮 偉特塔羅 · 抽牌與筆記</h1>
      <nav>
        <button id="t-draw" class="on">抽牌</button>
        <button id="t-hist">我的紀錄</button>
        <button id="t-deck">78 張牌庫</button>
        <span id="auth-bar" class="row" style="margin: 0">
          <span class="mut" id="sync">本機儲存</span>
        </span>
      </nav>

      <section id="v-draw">
        <div class="row">
          <input id="q" type="text" placeholder="寫下你的問題（可留空）" />
          <select id="sp"></select>
          <select id="duse" title="抽牌使用的牌組"></select>
          <label class="mut">
            <input type="checkbox" id="rv" checked style="padding: 0" />
            含逆位
          </label>
          <button class="pri" id="go">洗牌抽牌</button>
        </div>
        <div class="slots" id="slots">
          <span class="mut">按「洗牌抽牌」開始，點擊牌背翻開。</span>
        </div>
        <div class="row" id="acts" style="justify-content: center"></div>
        <div class="detail" id="det">
          <span class="dim">滑過或點擊任一張牌，即可查看牌義。</span>
        </div>
      </section>

      <section id="v-hist" class="hide">
        <div class="row">
          <button id="addm">＋ 手動新增紀錄</button>
          <span class="mut">紀錄存在此瀏覽器中，可隨時編輯問題與筆記。</span>
        </div>
        <div id="list"></div>
      </section>

      <section id="v-deck" class="hide">
        <div class="row" id="deck-bar">
          <span class="mut">牌組類別</span>
          <select id="dsel"></select>
          <button id="dadd">＋ 新增</button>
          <button id="dren">重新命名</button>
          <button id="ddel">刪除類別</button>
        </div>
        <div class="detail hide" id="deck-det"></div>
        <div class="grid" id="deck"></div>
      </section>
      <input type="file" id="fi" accept="image/*" multiple class="hide" />
      <input type="file" id="f1" accept="image/*" class="hide" />
      <div class="tip hide" id="tip"></div>
    </main>
    <script>
      const MA =
        "愚者|The Fool|新開始、自由、冒險|魯莽、猶豫、天真過頭;魔術師|The Magician|創造力、行動力、善用資源|操弄、欺瞞、才能浪費;女祭司|The High Priestess|直覺、潛意識、神祕|忽視直覺、隱藏動機;皇后|The Empress|豐盛、滋養、感官享受|過度依賴、停滯、過度保護;皇帝|The Emperor|權威、秩序、穩定|專制、僵化、失控;教皇|The Hierophant|傳統、信仰、指引|打破常規、盲從;戀人|The Lovers|愛、選擇、和諧|失衡、錯誤抉擇;戰車|The Chariot|意志、勝利、前進|失控、方向不明;力量|Strength|勇氣、耐心、柔韌|自我懷疑、軟弱;隱者|The Hermit|內省、獨處、智慧|孤立、逃避;命運之輪|Wheel of Fortune|轉機、循環、命運|厄運、抗拒改變;正義|Justice|公正、因果、真相|不公、逃避責任;倒吊人|The Hanged Man|犧牲、換位思考、暫停|拖延、無謂犧牲;死神|Death|結束、轉化、重生|抗拒改變、停滯;節制|Temperance|平衡、調和、耐心|失衡、過度;惡魔|The Devil|束縛、慾望、執著|解脫、覺醒;高塔|The Tower|突變、崩解、覺醒|逃過一劫、延遲的災難;星星|The Star|希望、療癒、靈感|失望、失去信心;月亮|The Moon|不安、幻象、潛意識|迷霧散去、釐清恐懼;太陽|The Sun|喜悅、成功、活力|過度樂觀、短暫陰霾;審判|Judgement|覺醒、召喚、重生|自我懷疑、拒絕反省;世界|The World|圓滿、完成、整合|未竟、遲滯".split(
          ";",
        );
      const SU = [
        ["權杖", "Wands", "🔥", "事業、熱情與行動"],
        ["聖杯", "Cups", "💧", "情感與人際關係"],
        ["寶劍", "Swords", "🌬️", "思想、溝通與衝突"],
        ["錢幣", "Pentacles", "🌍", "金錢、工作與物質"],
      ];
      const RK =
        "王牌|Ace|新的起點、潛能萌芽|延遲、錯失時機;二|Two|抉擇、平衡、合作|猶豫、失衡;三|Three|成長、合作、初步成果|受阻、意見分歧;四|Four|穩定、休憩、鞏固|停滯、不安;五|Five|衝突、挑戰、損失|緩和、走出低谷;六|Six|和諧、過渡、獲得支援|停滯、難以前進;七|Seven|堅持、評估、考驗|動搖、白費力氣;八|Eight|行動、進展、專注|受阻、分心;九|Nine|接近完成、韌性、累積|疲憊、過度防備;十|Ten|圓滿、終點、承擔|重擔、結束後的失落;侍者|Page|好奇、消息、學習|不成熟、壞消息;騎士|Knight|追求、行動、衝勁|躁進、半途而廢;王后|Queen|成熟、關懷、內在掌握|情緒化、失衡;國王|King|掌控、責任、領導|濫權、專橫".split(
          ";",
        );
      const D = [];
      MA.forEach((s, i) => {
        const [z, e, u, r] = s.split("|");
        D.push({ id: i, z, e, sym: "✦", n: i, u, r, sub: "大阿爾卡納" });
      });
      SU.forEach((su, si) =>
        RK.forEach((s, ri) => {
          const [z, e, u, r] = s.split("|");
          D.push({
            id: 22 + si * 14 + ri,
            z: su[0] + z,
            e: (ri < 10 && ri > 0 ? e : e) + " of " + su[1],
            sym: su[2],
            n:
              ri < 10
                ? ri == 0
                  ? "A"
                  : ri + 1
                : ["P", "Kn", "Q", "K"][ri - 10],
            u: su[3] + "面向：" + u,
            r: su[3] + "面向：" + r,
            sub: "小阿爾卡納・" + su[0],
          });
        }),
      );
      D.forEach((c) => {
        const x = c.e.match(
          /^(Ace|Two|Three|Four|Five|Six|Seven|Eight|Nine|Ten|Page|Knight|Queen|King) of/,
        );
      });
      const $ = (s) => document.querySelector(s),
        mem = {};
      const store = {
        get(k, d) {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : d;
          } catch (e) {
            return mem[k] ?? d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {
            mem[k] = v;
          }
        },
      };
      let hist = store.get("tarot-hist", []),
        drawn = [],
        pinned = null;
      const save = () => store.set("tarot-hist", hist);
      let _cuRaw = store.get("tarot-custom", {}),
        editing = false,
        cur = [0, undefined];
      let DECKS = store.get("tarot-decks", [{ id: "rws", name: "偉特塔羅" }]);
      if (!Array.isArray(DECKS) || !DECKS.length)
        DECKS = [{ id: "rws", name: "偉特塔羅" }];
      let deckId = store.get("tarot-deck-id", DECKS[0].id);
      if (!DECKS.some((d) => d.id === deckId)) deckId = DECKS[0].id;
      let CU = (function (raw) {
        const keys = Object.keys(raw || {});
        if (!keys.length) return { [deckId]: {} };
        if (keys.every((k) => /^\d+$/.test(k))) return { rws: raw };
        return raw;
      })(_cuRaw);
      if (!CU[deckId]) CU[deckId] = {};
      let IMG = {};
      const saveDecks = () => {
        store.set("tarot-decks", DECKS);
        store.set("tarot-deck-id", deckId);
      };
      const deckName = (id) =>
        (DECKS.find((d) => d.id === id) || {}).name || id;
      function ik(id, did) {
        return (did || deckId) + ":" + id;
      }
      function getImg(id, did) {
        return IMG[ik(id, did)];
      }
      function getCU(id) {
        if (!CU[deckId]) CU[deckId] = {};
        return CU[deckId][id] || {};
      }
      const detBox = () =>
        !$("#v-deck").classList.contains("hide") && $("#deck-det")
          ? $("#deck-det")
          : $("#det");
      function show(id, rev) {
        if (editing) return;
        cur = [id, rev];
        const c = D[id],
          u = getCU(id),
          im = getImg(id),
          has = u.u || u.r || u.n,
          box = detBox();
        box.classList.remove("hide");
        box.innerHTML = `<div class="det">${im ? `<img src="${im}" class="${rev === true ? "rev" : ""}" alt="">` : ""}<div class="dbody"><h3>${c.sym} ${c.z} <small class="dim">${c.e}・${c.sub}・${esc(deckName(deckId))}</small></h3><p class="${rev !== true ? "hl" : "dim"}"><b>正位：</b>${c.u}</p><p class="${rev === true ? "hl" : "dim"}"><b>逆位：</b>${c.r}</p>${has ? `<div class="pm"><b>🌙 我的牌義</b>${u.u ? `<p><b>正位：</b>${esc(u.u)}</p>` : ""}${u.r ? `<p><b>逆位：</b>${esc(u.r)}</p>` : ""}${u.n ? `<p><b>心得：</b>${esc(u.n)}</p>` : ""}</div>` : ""}<div class="row" style="margin:8px 0 0"><button id="ed">✎ ${has ? "編輯" : "新增"}我的牌義</button><button id="ci">${im ? "更換" : "上傳"}牌面圖</button>${im ? `<button id="cd">刪除卡面</button>` : ""}</div></div></div>`;
        $("#ed").onclick = edit;
        $("#ci").onclick = () => {
          imgTarget = id;
          $("#f1").click();
        };
        if ($("#cd"))
          $("#cd").onclick = function () {
            if (this.dataset.s) {
              remImg(id).then(() => {
                redraw();
                show(...cur);
              });
            } else {
              this.dataset.s = 1;
              this.textContent = "再按一次確認刪除";
            }
          };
      }
      function edit() {
        editing = true;
        const id = cur[0],
          c = D[id],
          u = getCU(id),
          box = detBox();
        box.innerHTML = `<h3>✎ ${c.z}（${esc(deckName(deckId))}）：我的牌義</h3><label class="mut">個人正位牌義</label><textarea id="eu">${esc(u.u || "")}</textarea><label class="mut">個人逆位牌義</label><textarea id="er">${esc(u.r || "")}</textarea><label class="mut">心得／聯想／相關經驗</label><textarea id="en">${esc(u.n || "")}</textarea><div class="row"><button class="pri" id="es">儲存</button><button id="ec">取消</button></div>`;
        $("#es").onclick = () => {
          const v = {
            u: $("#eu").value.trim(),

          k == "tarot-custom" ||
          k == "tarot-cs" ||
          k == "tarot-decks" ||
          k == "tarot-deck-id"
        ) {
          cfgU = Date.now();
          sset("tarot-cfgu", cfgU);
          later("c", pushCfg);
        }
      };
      async function syncAll() {
        const root = userCol();
        if (!root) return;
        if (syncing) return;
        say("同步紀錄中…");
        syncing = true;
        try {
          const cloud = {};
          const snap = await withTimeout(
            root.collection("hist").get(),
            20000,
            "Firestore",
          );
          snap.forEach((d) => {
            const x = d.data();
            if (!x || !x.j) return;
            try {
              const h = JSON.parse(x.j);
              if (h && h.id && Array.isArray(h.cards)) cloud[h.id] = h;
            } catch (e) {}
          });
          hist = hist.filter((h) => h && h.id && Array.isArray(h.cards));
          const known = store.get("tarot-known", []).map(String),
            out = [];
          new Set([
            ...Object.keys(cloud),
            ...hist.map((h) => String(h.id)),
          ]).forEach((id) => {
            const c = cloud[id],
              l = hist.find((x) => String(x.id) == id);
            if (c && l) out.push((l.u || 0) > (c.u || 0) ? l : c);
            else if (c) out.push(c);
            else if (!known.includes(id)) out.push(l);
          });
          out.sort((a, b) => b.id - a.id);
          hist = out;
          lastS = {};
          Object.entries(cloud).forEach(([id, c]) => (lastS[id] = jstr(c)));
          let cfg = null;
          try {
            const cfgSnap = await withTimeout(
              root.collection("meta").doc("cfg").get(),
              15000,
              "設定",
            );
            if (cfgSnap.exists) cfg = cfgSnap.data();
          } catch (e) {}
          if (cfg && (cfg.u || 0) > cfgU) {
            try {
              const raw = JSON.parse(cfg.cu || "{}");
              const keys = Object.keys(raw || {});
              CU =
                keys.length && keys.every((k) => /^\d+$/.test(k))
                  ? { rws: raw }
                  : raw || {};
              CS = JSON.parse(cfg.cs || "{}");
              if (cfg.decks) {
                try {
                  const ds = JSON.parse(cfg.decks);
                  if (Array.isArray(ds) && ds.length) DECKS = ds;
                } catch (e) {}
              }
              if (cfg.deckId && DECKS.some((d) => d.id === cfg.deckId))
                deckId = cfg.deckId;
              else if (!DECKS.some((d) => d.id === deckId))
                deckId = DECKS[0].id;
              if (!CU[deckId]) CU[deckId] = {};
              cfgU = cfg.u;
              sset("tarot-custom", CU);
              sset("tarot-cs", CS);
              sset("tarot-decks", DECKS);
              sset("tarot-deck-id", deckId);
              sset("tarot-cfgu", cfgU);
            } catch (e) {}
          } else if (!cfg || cfgU > (cfg.u || 0)) {
            say("上傳設定中…");
            syncing = false;
            await pushCfg();
            syncing = true;
          }
          say("上傳紀錄中…");
          syncing = false;
          await pushHist();
          syncing = true;
          say("同步圖片中…");
          await pullImages();
          fillSp();
          fillDeckSel();
          redraw();
          if (!$("#v-hist").classList.contains("hide")) renderList();
          say(tnow());
        } catch (e) {
          say("同步失敗：" + fbErr(e));
        } finally {
          syncing = false;
        }
      }
      hist = hist.filter((h) => h && h.id && Array.isArray(h.cards));
      sset("tarot-hist", hist);
      (async () => {
        if (!fbConfigured()) {
          say("本機儲存");
          return;
        }
        if (typeof firebase === "undefined") {
          say("本機儲存（Firebase SDK 載入失敗）");
          return;
        }
        try {
          if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
          fbAuth = firebase.auth();
          fbDb = firebase.firestore();
          try {
            fbDb.settings({
              ignoreUndefinedProperties: true,
              experimentalForceLongPolling: true,
            });
          } catch (e) {}
          fbSt = firebase.storage();
          async function assertFirestore(u) {
            const token = await u.getIdToken();
            const url =
              "https://firestore.googleapis.com/v1/projects/" +
              FIREBASE_CONFIG.projectId +
              "/databases/(default)/documents/users/" +
              u.uid +
              "/hist";
            const r = await fetch(url, {
              headers: { Authorization: "Bearer " + token },
            });
            const t = await r.text();
            if (r.status === 403) {
              if (/has not been used|is disabled/i.test(t))
                throw new Error(
                  "請先啟用 Cloud Firestore API（Google Cloud 主控台）",
                );
              if (/insufficient permissions|PERMISSION_DENIED/i.test(t))
                throw new Error(
                  "Firestore 規則拒絕存取：請到「規則」分頁允許已登入使用者讀寫",
                );
            }
            if (r.status === 404 && /database/i.test(t))
              throw new Error("請先在 Firebase 建立 Firestore 資料庫");
          }
          fbAuth.onAuthStateChanged(async (u) => {
            fbUser = u;
            if (u) {
              say("已登入，檢查雲端…");
              try {
                await assertFirestore(u);
              } catch (e) {
                say("同步失敗：" + fbErr(e));
                return;
              }
              if (
                !cfgU &&
                (Object.keys(CU).length || Object.keys(CS).length)
              ) {
                cfgU = Date.now();
                sset("tarot-cfgu", cfgU);
              }
              await syncAll();
            }
          });
          try {
            await fbAuth.signInWithEmailAndPassword(
              FIREBASE_AUTH.email,
              FIREBASE_AUTH.password,
            );
          } catch (e) {
            if (e && e.code === "auth/user-not-found") {
              await fbAuth.createUserWithEmailAndPassword(
                FIREBASE_AUTH.email,
                FIREBASE_AUTH.password,
              );
            } else if (e && e.code === "auth/invalid-credential") {
              try {
                await fbAuth.createUserWithEmailAndPassword(
                  FIREBASE_AUTH.email,
                  FIREBASE_AUTH.password,
                );
              } catch (e2) {
                say("雲端登入失敗：" + fbErr(e));
              }
            } else {
              say("雲端登入失敗：" + fbErr(e));
            }
          }
        } catch (e) {
          say("本機儲存（" + fbErr(e) + "）");
        }
      })();
      const rl1 = renderList;
      renderList = function () {
        rl1();
        document.querySelectorAll("#list .entry").forEach((el) => {
          const h = hist.find((x) => String(x.id) == el.dataset.h),
            d = el.querySelector(".del");
          if (!d) return;
          const n = d.cloneNode(true);
          d.replaceWith(n);
          n.textContent = "\u{1F5D1} \u522a\u9664\u6b64\u7d00\u9304";
          n.onclick = () => {
            const row = n.parentNode;
            row.innerHTML =
              '<span>\u78ba\u5b9a\u8981\u522a\u9664\u9019\u7b46\u7d00\u9304\u55ce\uff1f\u522a\u9664\u5f8c\u7121\u6cd5\u5fa9\u539f\u3002</span><button class="pri yes">\u78ba\u5b9a\u522a\u9664</button><button class="no">\u53d6\u6d88</button>';
            row.querySelector(".yes").onclick = () => {
              hist = hist.filter((x) => x !== h);
              save();
              renderList();
            };
            row.querySelector(".no").onclick = () => renderList();
          };
        });
      };
      const rl2 = renderList;
      renderList = function () {
        rl2();
        document.querySelectorAll("#list .entry").forEach((el) => {
          const h = hist.find((x) => String(x.id) == el.dataset.h);
          el.insertAdjacentHTML(
            "afterbegin",
            '<div class="row top" style="margin:0 0 4px;justify-content:flex-end"><button class="del2">\u{1F5D1} \u522a\u9664\u9019\u7b46</button></div>',
          );
          const row = el.querySelector(".top"),
            orig = row.innerHTML;
          const ask = () => {
            row.innerHTML =
              '<span>\u78ba\u5b9a\u8981\u522a\u9664\u9019\u7b46\u7d00\u9304\u55ce\uff1f\u7121\u6cd5\u5fa9\u539f\u3002</span><button class="pri yes">\u78ba\u5b9a\u522a\u9664</button><button class="no">\u53d6\u6d88</button>';
            row.querySelector(".yes").onclick = () => {
              hist = hist.filter((x) => x !== h);
              save();
              renderList();
            };
            row.querySelector(".no").onclick = () => {
              row.innerHTML = orig;
              row.querySelector(".del2").onclick = ask;
            };
          };
          row.querySelector(".del2").onclick = ask;
        });
      };
      renderList();
    </script>
  </body>
</html>
