<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7a4fb0" />
    <title>偉特塔羅 · 抽牌與筆記</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  </head>
  <body>
    <main>
      <h1>🔮 偉特塔羅 · 抽牌與筆記</h1>
      <div id="sync-status" class="sync-status" data-kind="idle" role="status" title="點擊可在失敗時重試同步">載入中…</div>
      <nav>
        <button id="t-draw" class="on">抽牌</button>
        <button id="t-hist">我的紀錄</button>
        <button id="t-deck">78 張牌庫</button>
      </nav>
      <section id="v-draw">
        <div class="row">
          <input id="q" type="text" placeholder="寫下你的問題（可留空）" />
          <select id="sp"></select>
          <select id="duse" title="抽牌使用的牌組"></select>
          <label class="mut"><input type="checkbox" id="rv" checked style="padding: 0" /> 含逆位</label>
          <button class="pri" id="go">洗牌抽牌</button>
        </div>
        <div class="slots" id="slots"><span class="mut">按「洗牌抽牌」開始，點擊牌背翻開。</span></div>
        <div class="row" id="acts" style="justify-content: center"></div>
        <div class="detail hide" id="aibox" hidden></div>
        <div class="detail hide" id="det" hidden></div>
      </section>
      <section id="v-hist" class="hide">
        <div class="row">
          <button id="addm">＋ 手動新增紀錄</button>
          <span class="mut">紀錄與牌義會存本機，並在儲存時同步到雲端。</span>
        </div>
        <div id="list"></div>
      </section>
      <section id="v-deck" class="hide">
        <div class="row" id="deck-bar">
          <span class="mut">牌組類別</span>
          <select id="dsel"></select>
          <button id="dadd">＋ 新增</button>
          <button id="dren">重新命名</button>
          <button id="ddel">刪除類別</button>
        </div>
        <div class="detail hide" id="deck-det" hidden></div>
        <div class="grid" id="deck"></div>
      </section>
      <input type="file" id="fi" accept="image/*" multiple class="hide" />
      <input type="file" id="f1" accept="image/*" class="hide" />
      <div class="tip hide" id="tip" hidden></div>
    </main>
    <div id="dlg" class="dlg hide" hidden>
      <div class="dlg-card" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <h3 id="dlg-title">請輸入</h3>
        <p id="dlg-msg" class="mut" style="display: none"></p>
        <input id="dlg-input" type="text" autocomplete="off" />
        <div class="row" style="margin: 12px 0 0; justify-content: flex-end">
          <button type="button" id="dlg-cancel">取消</button>
          <button type="button" class="pri" id="dlg-ok">確定</button>
        </div>
      </div>
    </div>
    <script>
      // 捕捉階段先清面板（走 clearDrawPanels；舊快取沒有時退回 hide 類別）
      document.addEventListener(
        "click",
        function (e) {
          var t = e.target;
          if (!t || t.id !== "go") return;
          if (typeof clearDrawPanels === "function") {
            clearDrawPanels();
            return;
          }
          ["det", "aibox", "deck-det", "tip"].forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.classList.add("hide");
            el.hidden = true;
            el.style.display = "none";
            el.innerHTML = "";
          });
        },
        true,
      );
    </script>
    <!-- 單一入口：版本號由 js/version.js 控制，改完跑 node tools/stamp.mjs -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
