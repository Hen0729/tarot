<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>偉特塔羅 · 抽牌與筆記</title>
    <link rel="stylesheet" href="css/styles.css?v=20261023c" />
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  </head>
  <body>
    <main>
      <h1>🔮 偉特塔羅 · 抽牌與筆記</h1>
      <nav>
        <button id="t-draw" class="on">抽牌</button>
        <button id="t-hist">我的紀錄</button>
        <button id="t-deck">78 張牌庫</button>
      </nav>
      <section id="v-draw">
        <div class="row">
          <input id="q" type="text" placeholder="寫下你的問題（可留空）" />
          <select id="sp"></select>
          <select id="duse" title="抽牌使用的牌組"></select>
          <label class="mut"><input type="checkbox" id="rv" checked style="padding: 0" /> 含逆位</label>
          <button class="pri" id="go">洗牌抽牌</button>
        </div>
        <div class="slots" id="slots"><span class="mut">按「洗牌抽牌」開始，點擊牌背翻開。</span></div>
        <div class="row" id="acts" style="justify-content: center"></div>
        <div class="detail hide" id="aibox"></div>
        <div class="detail hide" id="det"></div>
      </section>
      <section id="v-hist" class="hide">
        <div class="row">
          <button id="addm">＋ 手動新增紀錄</button>
          <span class="mut">紀錄存在此瀏覽器中，可隨時編輯問題與筆記。</span>
        </div>
        <div id="list"></div>
      </section>
      <section id="v-deck" class="hide">
        <div class="row" id="deck-bar">
          <span class="mut">牌組類別</span>
          <select id="dsel"></select>
          <button id="dadd">＋ 新增</button>
          <button id="dren">重新命名</button>
          <button id="ddel">刪除類別</button>
        </div>
        <div class="detail hide" id="deck-det"></div>
        <div class="grid" id="deck"></div>
      </section>
      <input type="file" id="fi" accept="image/*" multiple class="hide" />
      <input type="file" id="f1" accept="image/*" class="hide" />
      <div class="tip hide" id="tip"></div>
      <div id="toast" aria-live="polite"></div>
    </main>
    <script src="js/config.js?v=20261023c"></script>
    <script src="js/core.js?v=20261023c"></script>
    <script src="js/spreads.js?v=20261023c"></script>
    <script src="js/ai.js?v=20261023c"></script>
    <script src="js/sync.js?v=20261023c"></script>
  </body>
</html>
